status: formal_production_ready
valid_for_formal_results: true
forecast_task:
  formal_leads:
  - 1
  - 12
  - 48
  current_execution_priority: 12
  lead_task_type: independent_direct_single_target
  lookback_steps: 48
  input_features: 8
  output_steps: 1
  input_target_rule: inputs x[t-h-47] through x[t-h]; target x[t]
architecture:
  name: global_cnn_lstm
  input_shape:
  - 48
  - 8
  conv_layers:
  - name: conv1
    in_channels: 8
    out_channels: 64
    kernel_size: 3
    padding: 1
    activation: relu
  - name: conv2
    in_channels: 64
    out_channels: 32
    kernel_size: 3
    padding: 1
    activation: relu
  lstm:
    name: lstm
    input_size: 32
    hidden_size: 64
    num_layers: 1
    batch_first: true
    output_use: last_time_step_hidden_representation
  dropout:
    name: dropout
    probability: 0.2
  dense_layers:
  - name: fc1
    in_features: 64
    out_features: 32
    activation: relu
  - name: output
    in_features: 32
    out_features: 1
    activation: linear
  parameter_count: 34977
  selection_status: fixed comparison architecture; shape and parameter count validated,
    not claimed to be a globally optimal architecture
locked_training_components:
  loss: mse_scaled_space
  optimizer_family: adam
  gradient_clipping_max_norm: 1.0
  checkpoint_selection: lowest_full_validation_mse
  checkpoint_reload_required: true
  formal_evaluation_scale: original_kwh_after_inverse_transformation
execution_profile:
  platform: cuda
  device: cuda
  formal_results_allowed: true
  formal_seed_policy:
    seeds:
    - 42
    - 123
    - 2026
    - 31415
    same_seed_set_across_strategies: true
  final_common_batch_size: 512
  num_workers: 0
  pin_memory: true
  formal_source_and_scratch_learning_rate: 0.001
  formal_fine_tuning_learning_rate: 3.0e-05
  formal_fine_tuning_scope: dense_head_only
  fine_tuning_layers:
    frozen:
    - conv1
    - conv2
    - lstm
    trainable:
    - fc1
    - output
  formal_validation_frequency: every_complete_epoch
  formal_validation_interval_epochs: 1
  formal_validation_scope: full_validation_split
  formal_max_epochs: 30
  conditional_absolute_max_epochs: 45
  early_stopping:
    patience_validation_checks: 5
    minimum_delta: 0.0
    reload_best_checkpoint: true
  scheduler:
    name: reduce_lr_on_plateau
    factor: 0.5
    patience_validation_checks: 2
    minimum_learning_rate: 1.0e-06
data_rules:
  sample_indexes:
    LCL_h12: outputs/tables/sample_construction/lcl_production_sample_index_h12.parquet
    CER_h12: outputs/tables/sample_construction/cer_production_sample_index_h12.parquet
  scaler_tables:
    LCL: outputs/tables/sample_construction/lcl_production_scaler_table.csv
    CER: outputs/tables/sample_construction/cer_production_scaler_table.csv
  support_days:
    LCL:
      date: '2013-01-01'
      allowed_as_input_support: true
      allowed_as_target: false
      included_in_scaler_fit: false
    CER:
      date: '2009-07-14'
      allowed_as_input_support: true
      allowed_as_target: false
      included_in_scaler_fit: false
  missing_rule: skip sample if any required input or target is missing; no imputation
  continuity_rule: exclude samples crossing a confirmed or conservative physical continuity
    boundary
  full_dense_tensors_saved_to_disk: false
  lazy_reconstruction: true
